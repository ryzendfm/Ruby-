name: PR All Tests (Groq & Discord)

on:
  pull_request:
    branches:
      - main
    paths:
      - 'test/**'
      - 'ruby_bot.py'
      - 'requirements.txt'
      - 'workflow/**'
  workflow_dispatch:

jobs:
  run-all-tests:
    name: Run All Connectivity Tests (run_all.py)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute All Tests (Groq & Discord)
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
        run: |
          python test/run_all.py
