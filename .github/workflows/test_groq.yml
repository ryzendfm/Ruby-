name: Test Groq Connectivity

on:
  workflow_dispatch:
    inputs:
      custom_model:
        description: 'Specific Groq model to test (leave blank for defaults)'
        required: false
        default: ''

jobs:
  test-groq:
    name: Verify Groq Models & API
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Groq Connectivity Test (Default Models)
        if: "${{ github.event.inputs.custom_model == '' }}"
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          python test/test_groq.py

      - name: Run Groq Connectivity Test (Custom Model)
        if: "${{ github.event.inputs.custom_model != '' }}"
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          python test/test_groq.py -m "${{ github.event.inputs.custom_model }}"
